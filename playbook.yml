---
- name: Configure common settings
  hosts: all
  become: yes
  roles:
    - common

- name: Configure Angie balance
  hosts: balance01
  become: yes
  roles:
    - balance

- name: Configure frontend servers
  hosts: front01,front02
  become: yes
  roles:
    - frontend

- name: Configure backend server
  hosts: back01
  become: yes
  roles:
    - backend