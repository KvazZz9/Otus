- name: "Копирование конфигурации виртуального хоста Nextcloud"
  copy:
    src: "{{ config_directory }}/nextcloud.conf"
    dest: /etc/apache2/sites-available/nextcloud.conf
    mode: '0644'
    backup: yes
  notify: restart apache2

- name: "Копирование конфигурации PHP-FPM для Nextcloud"
  copy:
    src: "{{ config_directory }}/php-fpm-nextcloud.conf"
    dest: "/etc/php/{{ php_version }}/fpm/pool.d/nextcloud.conf"
    mode: '0644'
    backup: yes
  notify: restart php-fpm

- name: "Отключение пула по умолчанию"
  command: sudo mv /etc/php/8.2/fpm/pool.d/www.conf /etc/php/8.2/fpm/pool.d/www.conf.disabled
  notify: restart apache2
  ignore_errors: yes
  tags: apache

- name: "Копирование дополнительных конфигураций (если есть)"
  copy:
    src: "{{ config_directory }}/{{ item }}"
    dest: "/etc/apache2/conf-available/{{ item }}"
    mode: '0644'
  loop:
    - security.conf
    - performance.conf
    - nextcloud-proxy.conf
  ignore_errors: yes
  notify: reload apache2

- name: "Включение дополнительных конфигураций Apache"
  command: "a2enconf {{ item }}"
  loop:
    - security
    - performance
    - nextcloud-proxy
  ignore_errors: yes
  notify: reload apache2

- name: "Отключение сайта по умолчанию"
  command: a2dissite 000-default
  notify: restart apache2
  ignore_errors: yes
  tags: apache

- name: "Включение сайта Nextcloud"
  command: a2ensite nextcloud
  notify: restart apache2
  tags: apache

- name: "Проверка синтаксиса конфигурации Apache"
  command: apache2ctl configtest
  register: apache_syntax_check
  failed_when: apache_syntax_check.rc != 0
  changed_when: false
  tags: apache

- name: "Очистка временных файлов"
  file:
    path: "/tmp/{{ nextcloud_archive }}"
    state: absent
  run_once: true
  when: inventory_hostname == 'app01'